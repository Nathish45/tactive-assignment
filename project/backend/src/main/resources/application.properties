# Server
server.port=8080

# H2 file-based database (persists to ./data/canteen.mv.db)
spring.datasource.url=jdbc:h2:file:./data/canteen;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 console for debugging (visit http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# App-specific config
canteen.order-cutoff-time=10:30:00
canteen.cancellation-grace-minutes=5
canteen.jwt.secret=change-this-secret-in-production-to-something-long-and-random
canteen.jwt.expiration-ms=86400000
